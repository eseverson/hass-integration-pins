name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(python -c "import json; print(json.load(open('custom_components/integration_pins/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $TAG but the manifest says $MANIFEST"
            exit 1
          fi
          echo "Releasing $MANIFEST"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Home Assistant and the test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          FRONTEND=$(python -c "import json,os,homeassistant.components.frontend as f;print(json.load(open(os.path.join(os.path.dirname(f.__file__),'manifest.json')))['requirements'][0])")
          pip install "$FRONTEND"

      - name: Run the test suite
        run: pytest -q

      - name: Build the release archive
        run: |
          # HACS extracts this straight into custom_components/<domain>/, so the
          # integration's own files have to sit at the top level of the archive.
          cd custom_components/integration_pins
          zip -r "$GITHUB_WORKSPACE/integration_pins.zip" . -x '*__pycache__*'

      - name: Publish the release with the archive attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" integration_pins.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
